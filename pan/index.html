<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geek-Hub 云盘 | 极客工坊</title>
<meta name="description" content="Geek-Hub 云盘入口，浏览器直接下载，无需登录、无需客户端。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155;
    --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(56,189,248,.18), transparent 60%),
      radial-gradient(800px 500px at 0% 110%, rgba(129,140,248,.14), transparent 60%);
  }
  .card{
    width:100%; max-width:460px; background:rgba(30,41,59,.72);
    border:1px solid var(--line); border-radius:18px; padding:32px 28px;
    backdrop-filter:blur(8px); text-align:center;
  }
  .logo{
    width:56px;height:56px;border-radius:14px;background:var(--accent);
    display:grid;place-items:center;font-weight:800;font-size:20px;
    color:#0f172a;margin:0 auto 18px;
  }
  h1{font-size:22px;letter-spacing:.5px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .btn{
    display:block;width:100%;padding:14px 18px;border-radius:12px;
    background:var(--accent);color:#0f172a;font-weight:700;font-size:16px;
    text-decoration:none;transition:transform .15s ease,box-shadow .15s ease;
    box-shadow:0 6px 18px rgba(56,189,248,.28);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(56,189,248,.36)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid #f8fafc;outline-offset:3px}
  .status{
    margin-top:18px;font-size:13px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
  .note{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12px;color:#64748b;text-align:left;
  }
  .note b{color:var(--muted)}
  .back{display:inline-block;margin-top:16px;font-size:13px;color:var(--accent);text-decoration:none}
  @media (prefers-reduced-motion: reduce){
    .btn{transition:none} .dot{animation:none}
  }
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">GH</div>
  <h1>Geek-Hub 云盘</h1>
  <p class="sub">浏览器直接下载 · 无需登录 · 无需客户端</p>

  <a class="btn" id="go" href="#">正在连接云盘…</a>
  <p class="status"><span class="dot" aria-hidden="true"></span><span id="tip">准备跳转</span></p>

  <div class="note">
    <p><b>说明：</b>云盘服务运行在一台临时服务器上，<b>长时间无人访问会休眠</b>，届时本页跳转可能失效。</p>
    <p style="margin-top:8px">若打不开，请稍后重试，或到 <b>GitHub</b> 上联系我。</p>
    <a class="back" href="/">← 返回 Geek-Hub 首页</a>
  </div>
</main>

<script>
(function(){
  "use strict";
  // ==== 云盘地址（隧道重启后需要更新这一行）====
  var PAN = "https://thursday-receives-brush-algebra.trycloudflare.com";
  // ==========================================

  var go = document.getElementById("go");
  var tip = document.getElementById("tip");
  go.href = PAN;
  go.textContent = "进入云盘 →";

  var n = 2;
  tip.textContent = n + " 秒后自动跳转";
  var t = setInterval(function(){
    n--;
    if (n <= 0){
      clearInterval(t);
      tip.textContent = "正在跳转…";
      window.location.href = PAN;
    } else {
      tip.textContent = n + " 秒后自动跳转";
    }
  }, 1000);
})();
</script>
</body>
</html>
