<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Git Drive · Geek-Hub 文件库</title>
<meta name="description" content="Geek-Hub 文件库：Windows 原版镜像与实用工具存档，支持断点续传。">
<meta name="theme-color" content="#1c1e2a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M2 6.6A2.6 2.6 0 0 1 4.6 4h4.1c.55 0 1.08.22 1.47.61L11.9 6.3h7.5A2.6 2.6 0 0 1 22 8.9v1.2H2z' fill='%23FFCE4A'/><path d='M2 9.6h20v7.8A2.6 2.6 0 0 1 19.4 20H4.6A2.6 2.6 0 0 1 2 17.4z' fill='%23FFBA1F'/></svg>">
<style>
  :root{
    --accent:#4cc2ff;
    --win:#202020; --bar:#2b2b2b; --side:#252525; --row-hover:#3a3a3a;
    --line:rgba(255,255,255,.07); --text:#f3f3f3; --muted:#9aa3ad;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:radial-gradient(1100px 600px at 12% -8%, #2b3a67 0%, transparent 55%),
               radial-gradient(900px 700px at 95% 8%, #47296b 0%, transparent 50%),
               radial-gradient(700px 500px at 50% 110%, #14314f 0%, transparent 55%),
               #14161d;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);display:flex;align-items:center;justify-content:center;
    padding:10px;min-height:100vh;
  }
  .win{width:100%;max-width:none;height:calc(100vh - 20px);min-height:480px;
    background:var(--win);border:1px solid rgba(255,255,255,.09);border-radius:9px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
  body.mini{padding:26px 18px}
  body.mini .win{max-width:920px;margin:0 auto;height:calc(100vh - 52px);
    border-radius:11px;box-shadow:0 34px 90px rgba(0,0,0,.68)}
  body.mini .titlebar{background:#1f1f1f}
  .titlebar{display:flex;align-items:center;height:38px;background:var(--bar);flex:0 0 auto}
  .tabs{display:flex;align-items:flex-end;height:100%}
  .tab{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 14px;background:#3a3a3a;
    border-radius:8px 8px 0 0;font-size:.82rem;align-self:flex-end}
  .tab svg{width:14px;height:14px}
  .tab .x{opacity:.5;font-size:.85rem;margin-left:2px}
  .newtab{margin-left:8px;color:var(--muted);font-size:1rem;padding:4px 8px;border-radius:6px}
  .tbtns{margin-left:auto;display:flex;height:100%}
  .tbtns button{width:46px;height:100%;display:grid;place-items:center;background:none;border:none;
    color:#d1d1d1;cursor:pointer;padding:0}
  .tbtns button svg{width:11px;height:11px;display:block}
  .tbtns button:hover{background:rgba(255,255,255,.08)}
  .tbtns button.cls:hover{background:#c42b1c;color:#fff}
  .nav{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex:0 0 auto}
  .nbtn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:#cfcfcf;
    font-size:.95rem;background:transparent;border:none;cursor:pointer;flex:0 0 auto}
  .nbtn:hover{background:rgba(255,255,255,.09)}
  .nbtn svg{width:15px;height:15px}
  .crumbs{flex:1;display:flex;align-items:center;gap:2px;background:#2f2f2f;border:1px solid var(--line);
    border-radius:6px;height:32px;padding:0 8px;min-width:0;overflow:hidden;white-space:nowrap}
  .crumb{display:flex;align-items:center;gap:6px;color:var(--text);background:none;border:none;
    padding:4px 7px;border-radius:5px;font-size:.82rem;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .crumb svg{width:14px;height:14px;flex:0 0 auto}
  .crumb:hover{background:rgba(255,255,255,.09)}
  .crumb.cur{cursor:default}
  .crumb.cur:hover{background:none}
  .csep{color:var(--muted);font-size:.7rem;flex:0 0 auto}
  .searchbox{display:flex;align-items:center;gap:6px;background:#2f2f2f;border:1px solid var(--line);
    border-radius:6px;height:32px;padding:0 10px;width:190px;flex:0 0 auto;color:var(--muted)}
  .searchbox svg{width:14px;height:14px;flex:0 0 auto}
  .searchbox input{background:none;border:none;outline:none;color:var(--text);font-size:.8rem;width:100%;font-family:inherit}
  .tools{display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--bar);border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .tbtn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:none;
    background:transparent;color:#d6d6d6;font-size:.8rem;cursor:pointer;font-family:inherit;white-space:nowrap}
  .tbtn:hover{background:rgba(255,255,255,.08)}
  .tbtn:disabled{opacity:.32;cursor:default;background:transparent}
  .tbtn svg{width:15px;height:15px;flex:0 0 auto}
  .tsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:0 0 auto}
  .main{flex:1;display:flex;min-height:0}
  .side{width:230px;flex:0 0 auto;background:var(--side);border-right:1px solid var(--line);
    padding:8px 6px;overflow-y:auto}
  .tree-root{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:.85rem;cursor:pointer}
  .tree-root:hover,.tree-root.on{background:rgba(255,255,255,.08)}
  .tree-root.on{background:rgba(76,194,255,.16);color:var(--accent)}
  .tree-root svg{width:15px;height:15px}
  .chev{width:16px;text-align:center;color:var(--muted);font-size:.68rem;transition:.15s;flex:0 0 auto}
  .chev.open{transform:rotate(90deg)}
  .tree-child{margin-left:18px}
  .tree-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;font-size:.82rem;
    color:#dcdcdc;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tree-item:hover{background:rgba(255,255,255,.08)}
  .tree-item.cur{background:rgba(76,194,255,.16);color:var(--accent)}
  .tree-item svg{width:15px;height:15px;flex:0 0 auto}
  .tree-item span:last-child{overflow:hidden;text-overflow:ellipsis}
  .content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win)}
  .list{flex:1;overflow-y:auto;padding:4px 8px 10px}
  .cols{display:grid;grid-template-columns:1fr 130px 110px 84px;gap:0;padding:6px 10px;
    position:sticky;top:0;background:var(--win);z-index:2;border-bottom:1px solid var(--line)}
  .cols div{color:var(--muted);font-size:.78rem;cursor:pointer;user-select:none}
  .cols div:hover{color:var(--text)}
  .cols .noc{cursor:default}
  .cols .noc:hover{color:var(--muted)}
  .row{display:grid;grid-template-columns:1fr 130px 110px 84px;align-items:center;padding:6px 10px;
    border-radius:6px;font-size:.84rem;cursor:pointer;gap:0}
  .row:hover{background:var(--row-hover)}
  .row.sel{background:rgba(76,194,255,.18);outline:1px solid rgba(76,194,255,.35)}
  .row .nm{display:flex;align-items:center;gap:9px;min-width:0}
  .row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .fic{width:20px;height:20px;flex:0 0 auto}
  .row small{color:var(--muted);font-size:.78rem}
  .row .type,.row .size{color:var(--muted);font-size:.78rem}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:.85rem}
  .detail{width:250px;flex:0 0 auto;background:var(--side);border-left:1px solid var(--line);
    padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;position:relative}
  .detail .big{display:grid;place-items:center;margin:14px 0 8px}
  .detail .big svg{width:58px;height:58px}
  .detail h3{margin:0 0 10px;font-size:.92rem;text-align:center;word-break:break-all;font-weight:600}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;padding:4px 0}
  .kv i{font-style:normal;color:var(--muted)}
  .kv b{font-weight:400;text-align:right;word-break:break-all;color:#e6e6e6}
  .detail h4{margin:12px 0 4px;font-size:.8rem;color:var(--text)}
  .dlbtn{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;
    border-radius:6px;border:1px solid rgba(76,194,255,.4);background:rgba(76,194,255,.12);
    color:var(--accent);font-size:.84rem;text-decoration:none;cursor:pointer;font-family:inherit}
  .dlbtn:hover{background:rgba(76,194,255,.22)}
  .dlbtn svg{width:15px;height:15px}
  .dlbtn.alt{background:transparent;border-color:var(--line);color:#c9d1d9;margin-top:8px}
  .dlbtn.alt:hover{border-color:rgba(76,194,255,.4);color:var(--accent)}
  .status{flex:0 0 auto;display:flex;gap:14px;padding:6px 14px;background:var(--bar);
    border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
  .dclose{display:none}
  .menu-btn{display:none}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;
    background:rgba(40,40,40,.96);border:1px solid var(--line);color:#eee;font-size:.8rem;
    padding:9px 16px;border-radius:8px;transition:.2s;pointer-events:none;z-index:99;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:760px){
    body{padding:0}
    .win{max-width:none;height:100vh;min-height:100vh;border-radius:0;border:none}
    body.mini{padding:14px 10px}
    body.mini .win{height:calc(100vh - 28px);border-radius:10px}
    .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-105%);
      transition:.22s;width:250px;box-shadow:8px 0 30px rgba(0,0,0,.5);padding-top:14px}
    .side.show{transform:none}
    .side-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
    .side-mask.show{display:block}
    .menu-btn{display:grid}
    .searchbox{width:118px}
    .detail{position:fixed;left:0;right:0;bottom:0;z-index:60;width:auto;max-height:62%;
      border-radius:14px 14px 0 0;transform:translateY(105%);transition:.22s;
      border:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
    .detail.show{transform:none}
    .dclose{display:grid;place-items:center;position:absolute;right:10px;top:10px;width:30px;height:30px;
      border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#ddd;font-size:1rem}
    .cols,.row{grid-template-columns:1fr 92px 74px}
    .c-type,.r-type{display:none}
    .crumb{font-size:.78rem}
    .tbtns button{width:42px}
    .tab{padding:0 10px}
  }

  /* ===== 管理员 / 模态框 / 右键菜单 / 多选 ===== */
  .tbtn.adm-on{color:#4cc2ff;border-color:rgba(76,194,255,.4)}
  .gd-modal{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.72);
    display:flex;align-items:center;justify-content:center;padding:16px}
  .gd-modal[hidden]{display:none}
  .gd-box{background:#1c1f26;border:1px solid rgba(255,255,255,.12);border-radius:12px;
    width:100%;max-width:420px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .gd-box.gd-wide{max-width:880px}
  .gd-mhead{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .gd-mhead b{font-size:.9rem;color:#f1f5f9}
  .gd-x{margin-left:auto;background:none;border:none;color:#9aa7b8;font-size:1rem;cursor:pointer;
    padding:3px 8px;border-radius:6px}
  .gd-x:hover{background:rgba(255,255,255,.08);color:#fff}
  .gd-mbody{padding:14px;overflow:auto;font-size:.85rem;color:#c9d4e2}
  .gd-mbody input{width:100%;box-sizing:border-box;margin-bottom:10px;background:#12151b;
    border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#eef2f8;padding:9px 12px;font-size:.9rem}
  .gd-mbody input:focus{outline:none;border-color:#4cc2ff}
  .gd-err{color:#f87171;font-size:.8rem;margin:0 0 8px}
  .gd-primary{display:inline-block;background:#0a84ff;color:#fff;border:none;border-radius:8px;
    padding:9px 18px;font-size:.88rem;cursor:pointer;text-decoration:none}
  .gd-primary:hover{background:#2b97ff}
  .gd-tip{color:#6b7a8d;font-size:.74rem;line-height:1.7;margin:10px 0 0}
  .gd-mfoot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:flex-end}
  .gd-prevbody pre{white-space:pre-wrap;word-break:break-all;background:#12151b;
    border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px;max-height:56vh;
    overflow:auto;font-size:.8rem;color:#dfe7f1;margin:0}
  .gd-prevbody img{max-width:100%;max-height:56vh;border-radius:8px;display:block;margin:0 auto}
  .gd-prevbody iframe{width:100%;height:58vh;border:0;border-radius:8px;background:#fff}
  .gd-ctx{position:fixed;z-index:90;background:#252830;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:5px;min-width:170px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
  .gd-ctx[hidden]{display:none}
  .gd-ctx button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
    color:#dbe4ee;font-size:.83rem;padding:8px 12px;border-radius:7px;cursor:pointer;text-align:left}
  .gd-ctx button:hover{background:rgba(76,194,255,.15);color:#fff}
  .gd-ctx button.danger:hover{background:rgba(248,113,113,.15);color:#fca5a5}
  .gd-ctx .sep{height:1px;background:rgba(255,255,255,.09);margin:4px 6px}
  .gd-multi{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
    background:#252830;border:1px solid rgba(76,194,255,.4);border-radius:30px;
    padding:9px 18px;display:flex;align-items:center;gap:14px;font-size:.85rem;color:#dbe4ee;
    box-shadow:0 10px 34px rgba(0,0,0,.5)}
  .gd-multi[hidden]{display:none}
  .gd-multi button{background:none;border:1px solid rgba(255,255,255,.2);color:#dbe4ee;
    border-radius:16px;padding:5px 14px;font-size:.8rem;cursor:pointer}
  .gd-multi button:hover{border-color:#4cc2ff;color:#fff}
  .gd-multi button.danger:hover{border-color:#f87171;color:#fca5a5}
  .row.sel2{background:rgba(76,194,255,.14);outline:1px solid rgba(76,194,255,.3)}
  .sha-line{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:#8fa3b8;
    word-break:break-all;line-height:1.6}
  .prevbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(76,194,255,.12);
    color:#4cc2ff;border:1px solid rgba(76,194,255,.35);border-radius:8px;padding:8px 14px;
    font-size:.85rem;cursor:pointer;margin-bottom:8px}
  .prevbtn:hover{background:rgba(76,194,255,.22)}
</style>
</head>

<script>
(function(){
"use strict";
var DATA = null, cur = "", sel = null, sortKey = "name", sortDir = 1, expanded = {};
var multi = {};   // 管理员多选集合 key -> file
var PAN_API = location.hostname === "127.0.0.1" ? "http://127.0.0.1:8099" : "https://pan.geekhub.dpdns.org";
var ADM_KEY = "gd_admin_auth";
var ADM = "", IS_ADM = false;
try { ADM = sessionStorage.getItem(ADM_KEY) || ""; } catch(e){}
var $ = function(id){ return document.getElementById(id); };
var IS_MINI = /[?&]mini=1/.test(location.search);
var PG_HOME = "../";
if(IS_MINI) document.body.classList.add("mini");

var TYPE = {
  iso:"光盘映像文件", img:"磁盘映像", vhd:"虚拟磁盘", exe:"应用程序", msi:"安装程序包",
  zip:"压缩文件", "7z":"7z 压缩包", rar:"RAR 压缩包", gz:"GZip 压缩包",
  txt:"文本文档", md:"Markdown 文档", pdf:"PDF 文档",
  ppt:"演示文稿", pptx:"演示文稿", doc:"文档", docx:"文档",
  png:"图像", jpg:"图像", jpeg:"图像", webp:"图像"
};
var ICON_MAP = {
  iso:"i-iso", img:"i-iso", vhd:"i-iso", exe:"i-app", msi:"i-app",
  zip:"i-zip", "7z":"i-zip", rar:"i-zip", gz:"i-zip",
  txt:"i-txt", md:"i-txt", pdf:"i-pdf", ppt:"i-slide", pptx:"i-slide",
  doc:"i-txt", docx:"i-txt", png:"i-img", jpg:"i-img", jpeg:"i-img", webp:"i-img"
};
function ext(n){ return (String(n).split(".").pop()||"").toLowerCase(); }
function svgIcon(id, cls){
  return '<svg class="'+(cls||"")+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#'+id+'"/></svg>';
}
function ftype(n, isDir){ return isDir ? "文件文件夹" : (TYPE[ext(n)] || (ext(n) ? ext(n).toUpperCase()+" 文件" : "文件")); }
function fmtSize(n){
  if(n==null) return "—";
  var u=["B","KB","MB","GB","TB"],i=0,v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  return (v>=100||i===0?Math.round(v):v.toFixed(1))+" "+u[i];
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function encPath(p){return String(p).split("/").filter(Boolean).map(encodeURIComponent).join("/");}
function href(f,kind){
  var b = kind==="backup"?f.backup:f.url;
  if(!b) return "";
  if(/\/$/.test(b)) return b + encPath(f.dir?f.dir+"/"+f.name:f.name);
  return b;
}
var touch = window.matchMedia("(hover: none)").matches;
var hist = [];

/* ===== 窗口按钮 ===== */
var WIC = {
  min:'<svg viewBox="0 0 12 12"><path d="M2.2 6h7.6" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>',
  max:'<svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.15"/></svg>',
  restore:'<svg viewBox="0 0 12 12"><rect x="2.2" y="4.2" width="5.6" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.05"/><path d="M4.4 4.2V3.1a1 1 0 0 1 1-1h4.3a1 1 0 0 1 1 1v4.3a1 1 0 0 1-1 1H8.9" fill="none" stroke="currentColor" stroke-width="1.05"/></svg>',
  close:'<svg viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>'
};
function toast(msg){
  var t = $("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
function onWindowed(){
  var w = 960, h = 660;
  var sw = (window.screen && screen.availWidth) || 1200;
  var sh = (window.screen && screen.availHeight) || 800;
  h = Math.min(h, sh - 120);
  var left = Math.max(0, Math.round((sw - w)/2));
  var top = Math.max(0, Math.round((sh - h)/2));
  var url = location.pathname + "?mini=1";
  var win = window.open(url, "gitdrive_window",
    "width="+w+",height="+h+",left="+left+",top="+top+",menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes");
  if(!win || win.closed){ toast("新窗口被浏览器拦截，已在本页切换为窗口模式"); location.href = url; }
}
function isTouchScreen(){
  try { return window.matchMedia("(pointer:coarse)").matches || window.innerWidth < 760; }
  catch(e){ return window.innerWidth < 760; }
}
function onMaximize(){
  var full = location.pathname;   // 去掉 ?mini=1，即全屏版
  // 手机端：新标签无法由脚本可靠关闭，直接在本标签原地变全屏最稳
  if(isTouchScreen()){ location.replace(full); return; }

  // 判断"打开我的那个标签"本身是不是全屏网盘
  var op = null, opIsPan = false;
  try { op = window.opener; } catch(e){ op = null; }
  if(op && !op.closed){
    try { opIsPan = /\/pan\/?$/.test(op.location.pathname || ""); } catch(e){ opIsPan = false; }
  }

  if(opIsPan){
    // 原标签就是全屏网盘：把焦点交回去，再关掉这个小窗
    try { op.focus(); } catch(e){}
    try { window.close(); } catch(e){}
    setTimeout(function(){ location.replace(full); }, 400);   // 关不掉就原地全屏
    return;
  }

  // 没有可用的全屏网盘标签（外部页打开的、或直接输网址进的）：先开一个，再关自己
  var w = null;
  try { w = window.open(full, "_blank"); } catch(e){ w = null; }
  if(!w){ location.replace(full); return; }
  try { w.focus(); } catch(e){}
  try { window.close(); } catch(e){}
  setTimeout(function(){
    // 还活着说明本窗口没被关掉：撤掉新开的标签，本页切全屏，避免留下两个
    try { if(w && !w.closed) w.close(); } catch(e){}
    location.replace(full);
  }, 450);
}
function onMinimize(){
  try { localStorage.setItem("gh_pan_min", "1"); } catch(e){}
  // 小窗本来就是弹出来的，最小化 = 关掉它最干净；
  // 只有 close 被浏览器拒绝（如直接输网址 ?mini=1 进来的）才退回跳主页
  try { window.close(); } catch(e){}
  setTimeout(function(){ if(!window.closed) location.href = PG_HOME; }, 180);
}
function onClose(){ location.href = PG_HOME; }
function renderWinButtons(){
  var bar = $("tbtns");
  if(IS_MINI){
    bar.innerHTML =
      '<button title="最大化（回到全屏网盘）" data-act="max">'+WIC.max+'</button>' +
      '<button title="最小化到主页" data-act="min">'+WIC.min+'</button>' +
      '<button class="cls" title="关闭（返回主页）" data-act="close">'+WIC.close+'</button>';
  } else {
    bar.innerHTML =
      '<button title="窗口化（弹出小窗）" data-act="win">'+WIC.restore+'</button>' +
      '<button title="最小化到主页" data-act="min">'+WIC.min+'</button>' +
      '<button class="cls" title="关闭（返回主页）" data-act="close">'+WIC.close+'</button>';
  }
  bar.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      var a = b.getAttribute("data-act");
      if(a==="win") onWindowed();
      else if(a==="max") onMaximize();
      else if(a==="min") onMinimize();
      else if(a==="close") onClose();
    });
  });
}
renderWinButtons();

/* ===== 目录树 ===== */
function buildTree(){
  var root = {};
  (DATA.files||[]).forEach(function(f){
    var parts=(f.dir||"").split("/").filter(Boolean), node=root;
    parts.forEach(function(p,i){
      var key=parts.slice(0,i+1).join("/");
      node[p] = node[p] || {__kids:{},__key:key};
      node = node[p].__kids;
    });
  });
  return root;
}
function renderTree(){
  var root = buildTree();
  var html = '<div class="tree-root'+(cur===""?" on":"")+'" data-go="">' +
    '<span class="chev'+(Object.keys(root).length?" open":"")+'">▸</span>' +
    svgIcon("i-pc") + '<b>Git Drive</b></div><div class="tree-child">';
  html += treeHTML(root);
  html += "</div>";
  $("tree").innerHTML = html;
  $("tree").querySelectorAll("[data-go]").forEach(function(el){
    el.addEventListener("click", function(){ go(el.getAttribute("data-go")); });
  });
  $("tree").querySelectorAll("[data-exp]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      var k = el.getAttribute("data-exp");
      expanded[k] = !expanded[k];
      renderTree();
    });
  });
}
function treeHTML(node){
  var keys = Object.keys(node).sort();
  var out = "";
  keys.forEach(function(k){
    var n = node[k], isOpen = !!expanded[n.__key];
    out += '<div class="tree-item'+(cur===n.__key?" cur":"")+'" data-go="'+esc(n.__key)+'">'+
      '<span class="chev'+(isOpen?" open":"")+'" data-exp="'+esc(n.__key)+'">▸</span>'+
      svgIcon("i-folder") + '<span>'+esc(k)+'</span></div>';
    if(isOpen){
      var kids = treeHTML(n.__kids);
      if(kids) out += '<div class="tree-child">'+kids+"</div>";
    }
  });
  return out;
}

/* ===== 列表 ===== */
function itemsIn(dir){
  var dirs = {}, files = [];
  (DATA.files||[]).forEach(function(f){
    var d = f.dir||"";
    if(d===dir){ files.push(f); return; }
    if(dir==="" || d.indexOf(dir+"/")===0){
      var rest = dir===""? d : d.slice(dir.length+1);
      var first = rest.split("/")[0];
      if(first) dirs[first] = true;
    }
  });
  var arr = Object.keys(dirs).map(function(n){
    var key = dir ? dir+"/"+n : n;
    return {name:n, dir:dir, isDir:true, __key:key, size:null, mtime:""};
  });
  return arr.concat(files);
}
function sortArr(a){
  var k=sortKey, d=sortDir;
  a.sort(function(x,y){
    if(x.isDir!==y.isDir) return x.isDir?-1:1;
    var vx=x[k], vy=y[k];
    if(k==="name"){ vx=x.name.toLowerCase(); vy=y.name.toLowerCase(); }
    if(vx==null) return 1; if(vy==null) return -1;
    return vx<vy?-d:vx>vy?d:0;
  });
  return a;
}
function arrow(k){ return sortKey===k ? (sortDir>0?" ↑":" ↓") : ""; }
function renderList(){
  var q = ($("q").value||"").trim().toLowerCase();
  var html = '<div class="cols">'+
    '<div data-sort="name">名称'+arrow("name")+'</div>'+
    '<div data-sort="mtime">修改日期'+arrow("mtime")+'</div>'+
    '<div class="c-type noc">类型</div>'+
    '<div data-sort="size">大小'+arrow("size")+'</div></div>';

  var rows;
  if(q){
    rows = (DATA.files||[]).filter(function(f){
      return (f.name+" "+(f.dir||"")).toLowerCase().indexOf(q)>=0;
    });
  } else {
    rows = itemsIn(cur);
  }
  sortArr(rows);

  if(!rows.length){
    html += '<div class="empty">'+(q?"没有匹配「"+esc(q)+"」的项目":"此文件夹为空")+"</div>";
  }
  rows.forEach(function(f){
    var isDir = !!f.isDir;
    var key = isDir && f.__key ? f.__key : (f.dir||"")+"/"+f.name;
    html += '<div class="row'+(sel===key?" sel":"")+'" data-key="'+esc(key)+'">'+
      '<div class="nm">'+svgIcon(isDir?"i-folder":(ICON_MAP[ext(f.name)]||"i-file"),"fic")+'<span>'+esc(f.name)+'</span></div>'+
      '<small>'+esc(f.mtime||"")+'</small>'+
      '<div class="type r-type">'+ftype(f.name,isDir)+'</div>'+
      '<div class="size">'+(isDir?"":fmtSize(f.size))+'</div></div>';
  });
  $("list").innerHTML = html;

  $("list").querySelectorAll("[data-sort]").forEach(function(el){
    el.addEventListener("click", function(){
      var k = el.getAttribute("data-sort");
      if(sortKey===k) sortDir=-sortDir; else {sortKey=k;sortDir=1;}
      renderList();
    });
  });
  $("list").querySelectorAll(".row").forEach(function(r, idx){
    var f = rows[idx];
    r.addEventListener("click", function(e){
      if(f.isDir && touch && !e.ctrlKey && !e.metaKey){ go(f.__key); return; }
      if(IS_ADM && (e.ctrlKey || e.metaKey)){
        var k = r.getAttribute("data-key");
        if(multi[k]){ delete multi[k]; r.classList.remove("sel2"); }
        else { multi[k] = f; r.classList.add("sel2"); }
        renderMultiBar();
        return;
      }
      sel = r.getAttribute("data-key");
      $("list").querySelectorAll(".row").forEach(function(x){x.classList.remove("sel");});
      r.classList.add("sel");
      showDetail(f);
    });
    r.addEventListener("dblclick", function(){
      if(f.isDir) go(f.__key || (f.dir?f.dir+"/"+f.name:f.name));
    });
    r.addEventListener("contextmenu", function(e){
      if(!IS_ADM) return;                 // 右键管理菜单仅管理员可见
      e.preventDefault();
      openCtx(e.clientX, e.clientY, f, r);
    });
  });
  $("status").textContent = rows.length+" 个项目"+(q?"（搜索结果）":"")+(sel?" · 已选中 1 个":"")+
    (DATA.updated?" · 更新于 "+DATA.updated:"");
}

/* ===== 详情 ===== */
function showDetail(f){
  var el = $("dbody");
  if(!f || f.isDir){
    var all = DATA.files||[];
    var dirFiles = f ? all.filter(function(x){ return (x.dir||"").indexOf(f.__key||"")===0; }) : all;
    el.innerHTML = '<div class="big">'+svgIcon(f?"i-folder":"i-pc")+'</div><h3>'+(f?esc(f.name):"Git Drive")+'</h3>'+
      '<div class="kv"><i>类型</i><b>'+(f?"文件文件夹":"云存储")+'</b></div>'+
      '<div class="kv"><i>'+(f?"包含项目":"项目总数")+'</i><b>'+dirFiles.length+'</b></div>'+
      '<div class="kv"><i>总体积</i><b>'+fmtSize(dirFiles.reduce(function(a,x){return a+(x.size||0);},0))+'</b></div>'+
      '<div class="kv"><i>更新时间</i><b>'+esc(DATA.updated||"—")+'</b></div>'+
      '<div class="kv"><i>托管</i><b>GitHub Releases</b></div>';
    if(touch) $("detail").classList.add("show");
    return;
  }
  var main = href(f,"main"), back = href(f,"backup");
  el.innerHTML = '<div class="big">'+svgIcon(ICON_MAP[ext(f.name)]||"i-file")+'</div><h3>'+esc(f.name)+'</h3>'+
    '<h4>详细信息</h4>'+
    '<div class="kv"><i>类型</i><b>'+ftype(f.name,false)+'</b></div>'+
    '<div class="kv"><i>大小</i><b>'+fmtSize(f.size)+'</b></div>'+
    '<div class="kv"><i>修改日期</i><b>'+esc(f.mtime||"—")+'</b></div>'+
    '<div class="kv"><i>位置</i><b>'+esc(f.dir||"Git Drive")+'</b></div>'+
    (typeof f.downloads === "number" ? '<div class="kv"><i>下载次数</i><b>'+f.downloads+'</b></div>' : "")+
    (f.note ? '<div class="kv"><i>来源</i><b>'+esc(f.note)+'</b></div>' : "")+
    (f.sha256 ? '<div class="kv"><i>SHA256 校验值</i></div><div class="sha-line">'+esc(f.sha256)+'</div>' : "")+
    (canPreview(f) ? '<button class="prevbtn" id="prevOpen">👁 在线预览</button>' : "")+
    (main?'<a class="dlbtn" href="'+esc(main)+'" download>'+svgIcon("i-dl")+' 主线下载</a>':"")+
    (back?'<a class="dlbtn alt" href="'+esc(back)+'" download>备用链接（沙箱网盘）</a>':"");
  if(canPreview(f)){
    var pb = el.querySelector("#prevOpen");
    if(pb) pb.addEventListener("click", function(){ openPreview(f); });
  }
  if(touch) $("detail").classList.add("show");
}
$("dclose").addEventListener("click", function(){ $("detail").classList.remove("show"); });

/* ===== 面包屑 ===== */
function renderCrumbs(){
  var parts = cur ? cur.split("/") : [];
  var html = '<button class="crumb'+(cur===""?" cur":"")+'" data-go="">'+svgIcon("i-folder")+'Git Drive</button>';
  var acc = "";
  parts.forEach(function(p){
    acc += (acc?"/":"")+p;
    html += '<span class="csep">›</span><button class="crumb'+(acc===cur?" cur":"")+
      '" data-go="'+esc(acc)+'">'+esc(p)+"</button>";
  });
  $("crumbs").innerHTML = html;
  $("crumbs").querySelectorAll("[data-go]").forEach(function(el){
    el.addEventListener("click", function(){ go(el.getAttribute("data-go")); });
  });
}

/* ===== 跳转 ===== */
function go(dir){
  dir = dir||"";
  if(dir!==cur) hist.push(cur);
  if(hist.length>60) hist.shift();
  sel = null;
  multi = {}; renderMultiBar();
  cur = dir;
  renderTree(); renderCrumbs(); renderList();
  if(touch) $("detail").classList.remove("show"); else showDetail(null);
  closeSide();
}

/* ===== 侧栏（移动端）===== */
function closeSide(){ $("side").classList.remove("show"); $("sideMask").classList.remove("show"); }
$("sideBtn").addEventListener("click", function(){
  $("side").classList.toggle("show"); $("sideMask").classList.toggle("show");
});
$("sideMask").addEventListener("click", closeSide);

/* ===== 导航按钮 ===== */

/* ===== 加载 ===== */
function admFetch(url, opt){
  opt = opt || {};
  opt.headers = Object.assign({"Authorization": ADM}, opt.headers || {});
  return fetch(PAN_API + url, opt);
}
function load(bust){
  $("list").innerHTML = '<div class="empty">⏳ 正在加载 Git Drive…</div>';
  if(IS_ADM){
    // 管理员：直接读沙箱网盘的实时清单（含下载次数与 SHA256）
    admFetch("/__manifest?_=" + Date.now())
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ DATA = j || {files:[]}; go(""); })
      .catch(function(){ toast("实时清单获取失败，改用静态数据"); loadFallback(bust); });
    return;
  }
  loadFallback(bust);
}
function loadFallback(bust){
  fetch("files.json"+(bust?"?v="+Date.now():""),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ DATA=j||{files:[]}; go(""); })
    .catch(function(e){
      DATA={files:[],updated:"—"};
      go("");
      $("list").innerHTML='<div class="empty">⚠️ 加载失败（'+esc(e.message)+'）<br>请点 ⟳ 重试</div>';
      $("status").textContent="加载失败";
    });
}
/* ===== 管理员登录 ===== */
function setAdm(on){
  IS_ADM = on;
  var t = $("admTxt");
  if(t) t.textContent = on ? "管理员 · 已登录" : "管理员登录";
  $("admBtn").classList.toggle("adm-on", on);
}
function showErr(t){ var e=$("loginErr"); e.textContent=t; e.hidden=false; }
$("admBtn").addEventListener("click", function(){
  if(IS_ADM){ toast("已是管理员身份（数据为实时同步）"); return; }
  $("loginModal").hidden = false;
  $("loginErr").hidden = true;
  $("admUser").value = ""; $("admPass").value = "";
  setTimeout(function(){ try{ $("admUser").focus(); }catch(e){} }, 60);
});
$("loginClose").addEventListener("click", function(){ $("loginModal").hidden = true; });
$("loginModal").addEventListener("click", function(e){ if(e.target === $("loginModal")) $("loginModal").hidden = true; });
function doLogin(){
  var u = $("admUser").value.trim(), p = $("admPass").value;
  if(!u || !p){ showErr("请填写用户名和密码"); return; }
  var a = "Basic " + btoa(unescape(encodeURIComponent(u + ":" + p)));
  $("loginGo").textContent = "验证中…";
  fetch(PAN_API + "/__whoami", {headers:{"Authorization": a}})
    .then(function(r){
      $("loginGo").textContent = "登录";
      if(r.ok){
        ADM = a;
        try { sessionStorage.setItem(ADM_KEY, a); } catch(e){}
        $("loginModal").hidden = true;
        setAdm(true);
        toast("已登录，切换到实时数据");
        load(true);
      } else if(r.status === 429){
        showErr("失败次数过多已被锁定，请稍后再试");
      } else {
        showErr("用户名或密码不对");
      }
    })
    .catch(function(){ $("loginGo").textContent = "登录"; showErr("无法连接网盘服务（可能暂时离线）"); });
}
$("loginGo").addEventListener("click", doLogin);
$("admPass").addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

/* ===== 右键菜单（管理员） ===== */
var ctx = $("ctxMenu");
function closeCtx(){ ctx.hidden = true; }
document.addEventListener("click", closeCtx);
window.addEventListener("blur", closeCtx);
function panFileUrl(f){ return PAN_API + "/" + encPath(f.dir ? f.dir + "/" + f.name : f.name); }
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("已复制"); }, function(){ fallbackCopy(t); });
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = document.createElement("textarea"); ta.value = t;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败"); }
  document.body.removeChild(ta);
}
function openCtx(x, y, f){
  var main = href(f,"main");
  var html = "";
  if(main) html += '<button data-act="dl">⬇ 下载</button>';
  html += '<button data-act="copy">🔗 复制网盘直链</button>';
  if(canPreview(f)) html += '<button data-act="prev">👁 在线预览</button>';
  html += '<div class="sep"></div>';
  html += '<button data-act="ren">✏️ 改名</button>';
  html += '<button data-act="del" class="danger">🗑️ 删除（进回收站）</button>';
  ctx.innerHTML = html;
  ctx.hidden = false;
  ctx.style.left = Math.max(4, Math.min(x, innerWidth - ctx.offsetWidth - 8)) + "px";
  ctx.style.top = Math.max(4, Math.min(y, innerHeight - ctx.offsetHeight - 8)) + "px";
  ctx.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      closeCtx();
      var act = b.getAttribute("data-act");
      if(act === "dl" && main){ var a = document.createElement("a"); a.href = main; a.download = f.name; a.click(); }
      else if(act === "copy") copyText(main || panFileUrl(f));
      else if(act === "prev") openPreview(f);
      else if(act === "ren") adminRename(f);
      else if(act === "del") adminDelete([f]);
    });
  });
}
function adminRename(f){
  var to = prompt("改名：「" + f.name + "」→", f.name);
  if(!to || to === f.name) return;
  admFetch("/__rename", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({dir: f.dir || "", name: f.name, to: to})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j.ok){ toast("已改名为 " + (j.name || to)); load(true); }
      else toast("改名失败：" + (j.error || "未知错误"));
    })
    .catch(function(){ toast("网络错误"); });
}
function adminDelete(list){
  if(!list.length) return;
  if(!confirm("删除所选 " + list.length + " 项？（移入沙箱网盘回收站，可恢复）")) return;
  var i = 0, fail = 0;
  (function next(){
    if(i >= list.length){
      multi = {}; renderMultiBar();
      if(fail) toast(fail + " 项删除失败");
      else toast("已移入回收站，可在沙箱网盘页恢复");
      load(true);
      return;
    }
    var f = list[i++];
    admFetch("/__delete/" + encodeURIComponent(f.name) + "?dir=" + encodeURIComponent(f.dir || ""), {method:"DELETE"})
      .then(function(r){ if(!r.ok) fail++; next(); })
      .catch(function(){ fail++; next(); });
  })();
}
function renderMultiBar(){
  var keys = Object.keys(multi);
  var bar = $("multiBar");
  if(!keys.length){ bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = "已选 " + keys.length + " 项" +
    '<button id="mbDel" class="danger">🗑️ 删除所选</button><button id="mbCancel">取消</button>';
  $("mbDel").addEventListener("click", function(){ adminDelete(keys.map(function(k){ return multi[k]; })); });
  $("mbCancel").addEventListener("click", function(){
    multi = {}; renderMultiBar();
    $("list").querySelectorAll(".row.sel2").forEach(function(x){ x.classList.remove("sel2"); });
  });
}

/* ===== 在线预览 ===== */
var PREV_TEXT = [".txt",".md",".log",".ini",".cfg",".nfo",".json",".xml",".csv",".py",".js",".css",".html",".htm",".bat",".ps1",".reg"];
var PREV_IMG = [".png",".jpg",".jpeg",".gif",".webp",".bmp",".svg",".ico"];
function canPreview(f){
  var d = "." + ext(f.name);
  return PREV_TEXT.indexOf(d) >= 0 || PREV_IMG.indexOf(d) >= 0 || d === ".pdf";
}
var prevModal = $("prevModal");
function closePrev(){ prevModal.hidden = true; $("prevBody").innerHTML = ""; }
$("prevClose").addEventListener("click", closePrev);
prevModal.addEventListener("click", function(e){ if(e.target === prevModal) closePrev(); });
function openPreview(f){
  var url = panFileUrl(f);
  var d = "." + ext(f.name);
  $("prevTitle").textContent = "预览：" + f.name;
  $("prevDl").setAttribute("href", url);
  $("prevDl").setAttribute("download", f.name);
  $("prevBody").innerHTML = '<p style="color:#6b7a8d">加载中…</p>';
  prevModal.hidden = false;
  if(PREV_IMG.indexOf(d) >= 0){ $("prevBody").innerHTML = '<img alt="" src="' + url + '">'; }
  else if(d === ".pdf"){ $("prevBody").innerHTML = '<iframe src="' + url + '"></iframe>'; }
  else {
    fetch(url).then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })
      .then(function(t){
        var pre = document.createElement("pre");
        pre.textContent = t.length > 400000 ? t.slice(0, 400000) + "\n…（内容过长已截断）" : t;
        $("prevBody").innerHTML = "";
        $("prevBody").appendChild(pre);
      })
      .catch(function(){ $("prevBody").innerHTML = '<p>预览加载失败（网盘可能暂时离线），稍后再试或直接下载。</p>'; });
  }
}
